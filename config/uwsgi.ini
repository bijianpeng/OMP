[uwsgi]
socket = 127.0.0.1:19003
chdir = /data/omp/omp_server
wsgi-file = /data/omp/omp_server/omp_server/wsgi.py
module = omp_server.wsgi:application
master = true
processes = 4
threads = 2
chmod-socket = 664
buffer-size = 65536
vacuum = true
daemonize = /data/omp/logs/uwsgi.log
pidfile = /data/omp/logs/omp_uwsgi.pid
home = /data/omp/component/env
enable-threads = true
preload=true
lazy-apps=true
